name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Firebase config
        shell: bash
        run: |
          if [ -z "${QUIZEXAM_FIREBASE_CONFIG}" ]; then
            echo "Missing repository secret: QUIZEXAM_FIREBASE_CONFIG" >&2
            exit 1
          fi
          printf '%s\n' "${QUIZEXAM_FIREBASE_CONFIG}" > config.js
        env:
          QUIZEXAM_FIREBASE_CONFIG: ${{ secrets.QUIZEXAM_FIREBASE_CONFIG }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
